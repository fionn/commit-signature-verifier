name: CI

on: [push]

permissions:
  contents: read

jobs:

  lint:

    name: Lint
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint newlines
        uses: fionn/newline-linter@v1.0.3

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Lint container file
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  check_dependencies:

    name: Check dependencies
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      checks: write
      security-events: write

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check dependency tidiness
        run: go mod tidy -diff

      - name: Check for vulnerable dependency use
        run: go tool govulncheck -format sarif ./... | jq "(.runs[].tool.driver.rules[]?.properties.tags)? |= unique" > govulncheck.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck

  test:

    name: Test
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make

      - name: Test
        run: make test
